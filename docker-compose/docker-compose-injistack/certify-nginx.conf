server {
    listen 80;

    # Two public URL shapes (set mosip.certify.domain.url to match):
    #   1) {host}/certify            e.g. https://xxx.ngrok-free.dev/certify
    #      wallet host = {host}/certify/{issuerId}
    #   2) {host}                    e.g. https://xxx.ngrok-free.dev
    #      wallet host = {host}/{issuerId}
    # Certify servlet path is always /v1/certify.

    location / {
        root /config/server;
        autoindex on;
    }

    # Shape 2: {host}/issuance/credential (domain.url has no /certify prefix)
    location ^~ /issuance/ {
        proxy_pass http://certify:8090/v1/certify/issuance/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Cache-Control' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # Shape 2: {host}/nonce
    location = /nonce {
        proxy_pass http://certify:8090/v1/certify/nonce;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Cache-Control' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # Shape 1: strip public /certify prefix → /v1/certify/
    # ^~ so /certify/.well-known is not captured as issuerId "certify"
    location ^~ /certify/ {
        proxy_pass http://certify:8090/v1/certify/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Cache-Control' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # Direct servlet path (W3C /vc-api, Postman, default)
    location ^~ /v1/certify/ {
        proxy_pass http://certify:8090/v1/certify/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Cache-Control' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # Shape 2 default issuer: {host}/.well-known/...
    location = /.well-known/did.json {
        proxy_pass http://certify:8090/v1/certify/.well-known/did.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Cache-Control' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    location = /.well-known/openid-credential-issuer {
        proxy_pass http://certify:8090/v1/certify/.well-known/openid-credential-issuer;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Cache-Control' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # Shape 2 per-issuer: {host}/{issuerId}/.well-known/openid-credential-issuer
    # Exclude reserved first segments (and "certify", which is the public prefix).
    location ~ ^/(?!v1|certify|issuance|issuers|oauth|nonce|vc-api|credentials)([^/]+)/\.well-known/openid-credential-issuer$ {
        rewrite ^ /v1/certify$uri break;
        proxy_pass http://certify:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Cache-Control' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    error_page   500 502 503 504  /50x.html;

    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}

