## ------------------------------------------- CredIssuer (Sunbird RC) Integration properties ------------------------------------------------------------
# Proxy mode: Certify acts as OpenID4VCI front-door; VC is fetched from CredIssuer backend
mosip.certify.integration.scan-base-package=io.mosip.certify.sunbirdrc.integration
mosip.certify.integration.audit-plugin=LoggerAuditService
mosip.certify.integration.vci-plugin=SunbirdRCVCIssuancePlugin
mosip.certify.plugin-mode=VCIssuance

## ------------------------------------------- Cache / identity related properties ------------------------------------------------------------
mosip.certify.cache.security.algorithm-name=AES/ECB/PKCS5Padding
mosip.certify.cache.secure.individual-id=false
mosip.certify.cache.store.individual-id=true
# Public certify URL (ngrok /certify)
mosip.certify.identifier=https://collectible-dissentiently-arie.ngrok-free.dev/certify

# Required by StatusListCredentialService even in VCIssuance / proxy mode
mosip.certify.data-provider-plugin.did-url=did:web:staging-opt:credissuer:com:certify:v1:certify:issuance:.well-known
mosip.certify.data-provider-plugin.issuer-public-key-uri=did:web:staging-opt:credissuer:com:certify:v1:certify:issuance:.well-known#key-0

## ------------------------------------------- CredIssuer proxy plugin properties ------------------------------------------------------------
# Spring still injects issue-credential-url (no default). Proxy issuance uses get-credential-url + bearer token.
mosip.certify.vciplugin.sunbird-rc.issue-credential-url=https://api.credissuer.com/api/credentials/credentials/
io.credissuer.com.get-credential-url=https://api.credissuer.com/api/credentials/credentials/
mosip.esignet.authenticator.credissuer.bearer-token=5965e3b390e35fc3f428b9ca24c0e7e65d99162e

# Staging CredIssuer (switch these if pointing at staging)
# mosip.certify.vciplugin.sunbird-rc.issue-credential-url=https://staging-api.credissuer.com/api/credentials/credentials/
# io.credissuer.com.get-credential-url=https://staging-api.credissuer.com/api/credentials/credentials/
# mosip.esignet.authenticator.credissuer.bearer-token=bd505d71c00246eca008a5b5bb8e051b

mosip.esignet.ida.vci-user-info-cache=userinfo
mosip.certify.vciplugin.sunbird-rc.supported-credential-types=FarmerCredential,MockVerifiableCredential

## ------------------------------------------- Issuer display (well-known issuer metadata) ------------------------------------------------------------
# Credential type / subject / display details come from credential_config table (certify_init.sql)
mosip.certify.credential-config.issuer.display={\
  {\
    'name': 'Construction company',\
    'locale': 'en'\
  }\
}
